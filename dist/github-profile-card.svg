<svg viewBox="0 0 494 195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bgGlowPC" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#0B1120"/>
    <stop offset="100%" stop-color="#050816"/>
  </radialGradient>
  <linearGradient id="borderGradPC" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00ff88"/>
    <stop offset="50%" stop-color="#00cc6a"/>
    <stop offset="100%" stop-color="#009944"/>
  </linearGradient>
  <linearGradient id="scanGradPC" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
    <stop offset="45%" stop-color="#00ff88" stop-opacity="0.05"/>
    <stop offset="50%" stop-color="#00ffaa" stop-opacity="0.65"/>
    <stop offset="55%" stop-color="#00ff88" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#00cc6a" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlinesPC" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#00ff88" opacity="0.03"/>
  </pattern>
  <filter id="glowPC" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.1" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .term    { font-family: 'Courier New', Consolas, monospace; font-size: 9px; fill: #64748B; letter-spacing: 0.5px; }
    .scan    { font-family: 'Courier New', Consolas, monospace; font-size: 7.5px; fill: #00ff88; letter-spacing: 1px; }
    .title   { font-family: 'Courier New', Consolas, monospace; font-size: 10px; fill: #00ff88; letter-spacing: 2px; opacity: 0.75; }
    .label   { font-family: 'Courier New', Consolas, monospace; font-size: 9px; fill: #64748B; letter-spacing: 0.8px; }
    .key     { font-family: 'Courier New', Consolas, monospace; font-size: 18px; fill: #00ff88; font-weight: bold; }
    .big     { font-family: 'Courier New', Consolas, monospace; font-size: 28px; fill: #00ff88; font-weight: bold; }
    .lang    { font-family: 'Courier New', Consolas, monospace; font-size: 9px; fill: #E5E7EB; }
  </style>
</defs>
<rect width="494" height="195" rx="14" fill="url(#bgGlowPC)"/>
<rect width="494" height="195" rx="14" fill="url(#scanlinesPC)"/>
<g id="titlebarPC">
  <rect x="3" y="3" width="488" height="22" rx="11" fill="#0B1120" fill-opacity="0.85"/>
  <circle cx="26" cy="14" r="3.4" fill="#EF4444"><animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="38" cy="14" r="3.4" fill="#F59E0B"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="50" cy="14" r="3.4" fill="#00ff88"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <text x="247" y="17.5" text-anchor="middle" class="term">sif@devos ~ % ./profile.sh --stats</text>
  <circle cx="436" cy="14" r="3" fill="#00ff88"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle>
  <text x="444" y="17" class="scan">LIVE</text>
</g>
<text x="18" y="43" class="title">GITHUB.PROFILE</text>

<text x="18" y="76" class="big" filter="url(#glowPC)">&#9733; 84</text>
<text x="18" y="90" class="label">STARS EARNED</text>

<text x="262" y="60" class="label">COMMITS (1Y)</text>
<text x="262" y="79" class="key">9</text>
<text x="262" y="100" class="label">PULL REQUESTS (1Y)</text>
<text x="262" y="119" class="key">0</text>

<line x1="18" y1="124" x2="476" y2="124" stroke="#1f2937" stroke-width="1"/>
<text x="18" y="136" class="label">TOP LANGUAGES</text>
<rect x="18" y="142" width="458" height="10" rx="5" fill="#0B1120"/>
<rect x="18" y="142" width="118.6198" height="10" fill="#f1e05a"/><rect x="136.6198" y="142" width="83.886" height="10" fill="#663399"/><rect x="220.5058" y="142" width="78.4156" height="10" fill="#3178c6"/><rect x="298.9214" y="142" width="70.5511" height="10" fill="#f7523f"/><rect x="369.4725" y="142" width="50.0408" height="10" fill="#4F5D95"/><rect x="419.5133" y="142" width="56.4867" height="10" fill="#334155"/>
<circle cx="18" cy="162" r="3" fill="#f1e05a"/><text x="26" y="165" class="lang">JavaScript 26%</text>
<circle cx="168" cy="162" r="3" fill="#663399"/><text x="176" y="165" class="lang">CSS 18%</text>
<circle cx="318" cy="162" r="3" fill="#3178c6"/><text x="326" y="165" class="lang">TypeScript 17%</text>
<circle cx="18" cy="176" r="3" fill="#f7523f"/><text x="26" y="179" class="lang">Blade 15%</text>
<circle cx="168" cy="176" r="3" fill="#4F5D95"/><text x="176" y="179" class="lang">PHP 11%</text>

<rect x="0" y="-40" width="494" height="40" fill="url(#scanGradPC)" opacity="0.6" style="mix-blend-mode:screen">
  <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 235" dur="4.2s" repeatCount="indefinite"/>
</rect>
<rect x="3" y="3" width="488" height="189" rx="12" fill="none" stroke="url(#borderGradPC)" stroke-width="2" opacity="0.8">
  <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.2s" repeatCount="indefinite"/>
</rect>
</svg>